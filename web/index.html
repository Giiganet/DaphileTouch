<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daphile">
<meta name="color-scheme" content="light dark">
<title>Daphile 音乐</title>
<script>/* 先定深浅色再画页面，避免闪一下。默认跟随系统；
   手动拨过开关时记成「主题@当时的系统主题」，系统主题变了这次手动选择就作废，重新跟随系统 */
(function () { var sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", o = null;
  try { localStorage.removeItem("daphile.theme"); o = (localStorage.getItem("daphile.themeOverride") || "").split("@"); } catch (e) {}
  document.documentElement.dataset.theme = o && o[1] === sys && (o[0] === "dark" || o[0] === "light") ? o[0] : sys; })();
/* 页面高度跟着屏幕走：iPad 旋转后 Safari 有时不重算 100% 高度，横屏回来仍按竖屏的高度排版。
   这里在旋转、窗口变化时量可见高度写入 --app-h，并把旋转中被带偏的页面滚动复位 */
(function () { var de = document.documentElement, t = 0;
  function fit() { var h = Math.round(window.visualViewport ? visualViewport.height : innerHeight) || innerHeight;
    de.style.setProperty("--app-h", h + "px"); if (scrollX || scrollY) scrollTo(0, 0); }
  function later() { fit(); clearTimeout(t); t = setTimeout(fit, 350); }   // 旋转动画结束后再量一次，取最终尺寸
  fit(); addEventListener("resize", later); addEventListener("orientationchange", later); addEventListener("pageshow", later);
  if (window.visualViewport) visualViewport.addEventListener("resize", later); })();</script>
<link rel="stylesheet" href="style.css?v=0.6.5">
</head>
<body>
<div class="app" id="app">

  <!-- 左侧边栏 -->
  <nav class="sidebar" id="sidebar">
    <!-- 侧边栏图标：SVG 线条，仿 SF Symbols，统一 24×24 画布、线宽 1.9 -->
    <button class="nav-item" data-view="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20.5 20.5"/></svg>搜索</button>
    <div class="nav-group">资料库</div>
    <button class="nav-item" data-view="recent"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.75"/><path d="M12 7v5.2l3.6 2.2"/></svg>最近添加</button>
    <button class="nav-item" data-view="artists"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.75" width="6" height="11.5" rx="3"/><path d="M5.75 11a6.25 6.25 0 0 0 12.5 0M12 17.25v3.5M8.75 20.75h6.5"/></svg>艺人</button>
    <button class="nav-item" data-view="albums"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/><path d="M12 6.2a5.8 5.8 0 0 1 5.8 5.8M6.2 12a5.8 5.8 0 0 0 5.8 5.8"/></svg>专辑</button>
    <button class="nav-item" data-view="songs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l10-2.2v12.3"/><circle cx="6.6" cy="17.6" r="2.5"/><circle cx="16.6" cy="15.4" r="2.5"/></svg>歌曲</button>
    <button class="nav-item" data-view="folders"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.25A1.75 1.75 0 0 1 4.75 5.5h4.1l2 2.25h8.4A1.75 1.75 0 0 1 21 9.5v8.25a1.75 1.75 0 0 1-1.75 1.75H4.75A1.75 1.75 0 0 1 3 17.75z"/><path d="M3 10.25h18"/></svg>文件夹</button>
    <div class="nav-sep" role="separator"></div>
    <button class="nav-item" data-view="playlists"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.25h17M3.5 9.75h17M3.5 14.25h17M3.5 18.75h17"/></svg>播放列表</button>
    <button class="nav-item" data-view="favorites"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2C6.9 16.4 3.6 13.4 3.6 9.5 3.6 7 5.5 5.1 8 5.1c1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1 2.5 0 4.4 1.9 4.4 4.4 0 3.9-3.3 6.9-8.4 10.7z"/></svg>我的喜爱</button>
    <div class="sidebar-foot">
      <button class="upd-box" id="upd-box" hidden>
        <svg class="upd-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"/></svg>
        <span class="upd-txt"><span class="upd-title" id="upd-title">插件更新已就绪</span><span class="upd-sub" id="upd-sub">点此重启 LMS 安装</span></span>
      </button>
      <!-- CD播放器：LMS 装了 CDplayer 插件才显示（app.js 启动时检测） -->
      <button class="nav-item nav-cd" id="nav-cd" data-view="cd" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/><path d="M12 6.2a5.8 5.8 0 0 1 5.8 5.8M6.2 12a5.8 5.8 0 0 0 5.8 5.8"/></svg>CD播放器</button>
      <!-- 最下一行：齿轮（设置菜单，版本号在菜单最下面）+ 深浅开关。
           开关里：浅色时圆钮在左、右边露出月亮；深色时圆钮在右、左边露出太阳 -->
      <div class="foot-row">
        <div class="foot-left">
        <button class="set-btn" id="btn-set" aria-label="设置" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="theme-switch" id="btn-theme" role="switch" aria-checked="false" aria-label="深色界面">
          <span class="ts-track" aria-hidden="true">
            <svg class="ts-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
            <svg class="ts-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg>
            <span class="ts-knob"></span>
          </span>
        </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容区：始终显示「当前播放」列表 -->
  <main class="main" id="main">
    <header class="topbar">
      <h1 class="view-title"><span class="cur-label">当前播放设备</span><span class="cur-sep" id="cur-sep" hidden>·</span><span class="cur-dev" id="cur-dev" hidden><span class="cur-dev-name" id="cur-dev-name"></span></span></h1>
      <span class="cur-adding" id="cur-adding" hidden><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>正在加入…</span>
      <span class="count cur-count" id="cur-count"></span>
      <!-- 更新：当前播放里有曲目的文件被删除或换了格式时才出现（见 app.js checkQueue） -->
      <button class="pill q-fix" id="btn-qfix" hidden></button>
      <!-- 存为播放列表：列表 + 加号（仿 SF Symbols text.badge.plus） -->
      <button class="icon-btn" id="btn-save" aria-label="存为播放列表" title="存为播放列表" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 6h12M3.5 11h12M3.5 16h7"/><path d="M18 13.5v7M14.5 17h7"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-clear" aria-label="清除当前播放" title="清除当前播放" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/>
          <path d="M6 7l1 13h10l1-13"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/>
        </svg>
      </button>
    </header>
    <section class="content" id="cur-list"></section>
  </main>

  <!-- 右侧弹出的选曲窗口：从左侧资料库分类打开 -->
  <aside class="picker" id="picker" hidden>
      <div class="picker-resize" id="picker-resize" role="separator" aria-orientation="vertical" aria-label="拖动调节宽度，双击恢复默认" title="拖动调节宽度，双击恢复默认"></div>
    <header class="picker-head">
      <h2 class="pick-cat" id="pick-cat"></h2>
      <span class="pick-count" id="pick-count"></span>
      <!-- CD 页专用：重新读取、弹出。它们管的是光驱，不是这张专辑，所以放在窗口右上角 -->
      <span class="cd-tools" id="cd-tools" hidden></span>
      <!-- 「我的喜爱」专用：删除（点了变成 全选 / 取消 / 删除（N）） -->
      <span class="fav-tools" id="fav-tools" hidden></span>
      <input class="filter" id="filter" type="search" placeholder="查找" autocomplete="off">
      <button class="icon-btn" id="btn-pick-close" aria-label="关闭">✕</button>
    </header>
    <div class="picker-cols">
      <!-- 左栏：分类下的条目（艺人、播放列表） -->
      <section class="pick-list" id="pick-list"></section>
      <!-- 两栏分隔线：左右拖动调两栏宽度，双击恢复默认 -->
      <div class="pick-split" id="pick-split" role="separator" aria-orientation="vertical" aria-label="拖动调节两栏宽度，双击恢复默认" title="拖动调节两栏宽度，双击恢复默认"></div>
      <!-- 右栏：选中条目的详情 -->
      <section class="pick-detail">
        <header class="detail-head">
          <button class="icon-btn" id="btn-back" hidden aria-label="返回">‹</button>
          <h3 class="view-title" id="view-title"></h3>
          <span class="pick-count" id="view-count"></span>
          <span class="head-act" id="view-act"></span>
        </header>
        <div class="picker-body" id="content"></div>
      </section>
    </div>
  </aside>

  <!-- 右侧「正在播放」信息面板（下方附继续播放队列） -->
  <aside class="queue" id="queue" hidden>
    <div class="panel-scroll">
      <div class="np">
        <img class="np-art" id="np-art" alt="" hidden>
        <div class="np-art np-art-empty" id="np-art-empty"></div>
        <div class="np-title" id="np-title">未在播放</div>
        <div class="np-artist" id="np-artist"></div>
        <div class="np-fmt" id="np-fmt"></div>
        <dl class="np-meta" id="np-meta"></dl>
      </div>
    </div>
  </aside>

  <!-- 底部悬浮播放条 -->
  <footer class="player" id="player">
    <!-- 大频谱：在进度条那一格的频谱上按住往上拖出来；按住它往下滑关闭 -->
    <div class="vu-big" id="vu-big" aria-hidden="true">
      <canvas id="vu-big-cv"></canvas>
      <span class="vu-na">不可用</span>
    </div>
    <div class="transport">
      <button class="icon-btn" id="btn-shuffle" aria-label="随机">
        <!-- 随机播放：两条交叉的线，右端各带箭头（仿 SF Symbols shuffle） -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17h3.2c2 0 3.2-.9 4.3-2.6l2.6-4.8C14.2 7.9 15.4 7 17.4 7H21"/>
          <path d="M3 7h3.2c2 0 3.2.9 4.3 2.6l2.6 4.8c1.1 1.7 2.3 2.6 4.3 2.6H21"/>
          <path d="M18 4l3 3-3 3"/><path d="M18 14l3 3-3 3"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-prev" aria-label="上一首">
        <!-- 上一首：一条竖线 + 一个朝左的实心三角（仿 SF Symbols backward.end.fill） -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <rect x="4.2" y="5.6" width="2.6" height="12.8" rx="1.1"/>
          <path d="M19.2 6.4v11.2L9.4 12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-btn big" id="btn-play" aria-label="播放">
        <!-- 播放 / 暂停：画成 SVG（仿 SF Symbols play.fill / pause.fill）。不用 ▶ ⏸ 字符，iPad 会把 ⏸ 画成彩色 emoji。
             按钮带 .playing 时显示暂停的两竖条，否则显示播放三角 -->
        <svg class="ic-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <path d="M7 4.5v15l12.5-7.5z"/>
        </svg>
        <svg class="ic-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-next" aria-label="下一首">
        <!-- 下一首：一个朝右的实心三角 + 一条竖线（仿 SF Symbols forward.end.fill） -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M4.8 6.4v11.2l9.8-5.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <rect x="17.2" y="5.6" width="2.6" height="12.8" rx="1.1"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-repeat" aria-label="重复">
        <!-- 重复：上下两段半圆弧组成的胶囊形循环，各带一个箭头；单曲重复时中间叠一个小「1」。
             中间是空的，同样 20px 看着比随机小，所以画成 22px，线宽 1.73 × 22/20 ≈ 1.9 与随机一致 -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.73" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 12A5.5 5.5 0 0 1 9 6.5h9"/><path d="M15.5 4l2.5 2.5-2.5 2.5"/>
          <path d="M20.5 12a5.5 5.5 0 0 1-5.5 5.5H6"/><path d="M8.5 15l-2.5 2.5 2.5 2.5"/>
        </svg>
      </button>
    </div>
    <div class="lcd">
      <span class="lcd-cover"><img id="lcd-cover" alt="" hidden></span>
      <div class="lcd-text">
        <!-- 曲名、歌手专辑两行文字的右边放心形（上下居中）：空心灰 = 未喜爱，实心红 = 已喜爱；
             文字太长时只省略文字，心形始终露在后面 -->
        <div class="lcd-lines">
          <div class="lcd-title" id="lcd-title">未在播放</div>
          <div class="lcd-sub" id="lcd-sub"></div>
        </div>
        <button class="fav-btn lcd-fav" id="lcd-fav" aria-label="加入喜爱" title="加入喜爱" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2C6.9 16.4 3.6 13.4 3.6 9.5 3.6 7 5.5 5.1 8 5.1c1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1 2.5 0 4.4 1.9 4.4 4.4 0 3.9-3.3 6.9-8.4 10.7z"/></svg></button>
      </div>
      <div class="lcd-time" id="lcd-time">
        <span id="t-cur">0:00</span>
        <div class="bar" id="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <span id="t-left">-0:00</span>
        <canvas class="vu" id="vu" aria-hidden="true"></canvas>
        <span class="vu-na">不可用</span>
      </div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="btn-queue" aria-label="正在播放信息">
        <!-- 列表：左侧三个圆点 + 右侧三条横线（仿 SF Symbols list.bullet），线宽与其他图标一致 -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="4.5" cy="6" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="4.5" cy="12" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="4.5" cy="18" r="1.5" fill="currentColor" stroke="none"/>
          <path d="M9 6h11.5"/><path d="M9 12h11.5"/><path d="M9 18h11.5"/>
        </svg>
      </button>
      <div class="dev-wrap">
        <button class="icon-btn" id="btn-devices" aria-label="转到其他设备播放" title="把正在播放的声音转到其他设备">
          <!-- AirPlay 音频图标：外环 + 中环 + 中心小圆，底部实心三角（仿 SF Symbols airplayaudio） -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M6 16a8.5 8.5 0 1 1 12 0"/>
            <path d="M8.5 13.5a5 5 0 1 1 7 0"/>
            <circle cx="12" cy="10" r="1.7"/>
            <path d="M12 13.4l4.6 7.6H7.4z" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <div class="devices" id="devices" hidden>
          <ul class="device-list" id="device-list"></ul>
          <div class="dev-hint" id="dev-hint" hidden>勾选的设备同步播放；取消勾选的那台会停止</div>
        </div>
      </div>
      <div class="vol-wrap">
        <button class="icon-btn mute-btn" id="btn-mute" aria-label="音量">
          <!-- 有声：喇叭 + 三道声波（仿 SF Symbols speaker.wave.3.fill） -->
          <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 9.5h3.2L11 5.5v13l-4.3-4H3.5z" fill="currentColor" stroke-width="1.2"/>
            <path d="M14.5 9a4 4 0 0 1 0 6"/><path d="M17 6.5a7.5 7.5 0 0 1 0 11"/><path d="M19.5 4a11 11 0 0 1 0 16"/>
          </svg>
          <!-- 静音：喇叭 + 叉（仿 SF Symbols speaker.slash.fill） -->
          <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 9.5h3.2L11 5.5v13l-4.3-4H3.5z" fill="currentColor" stroke-width="1.2"/>
            <path d="M15 9l6 6"/><path d="M21 9l-6 6"/>
          </svg>
        </button>
        <!-- 音量面板：静音键 + 滑块 + 数值；固定输出的设备滑块灰掉，下面一行说明 -->
        <div class="vol-pop" id="vol-pop" hidden>
          <div class="vol-row">
            <button class="icon-btn mute-btn vol-mute" id="vol-mute" aria-label="静音">
            <!-- 有声：喇叭 + 三道声波（仿 SF Symbols speaker.wave.3.fill） -->
            <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 9.5h3.2L11 5.5v13l-4.3-4H3.5z" fill="currentColor" stroke-width="1.2"/>
              <path d="M14.5 9a4 4 0 0 1 0 6"/><path d="M17 6.5a7.5 7.5 0 0 1 0 11"/><path d="M19.5 4a11 11 0 0 1 0 16"/>
            </svg>
            <!-- 静音：喇叭 + 叉（仿 SF Symbols speaker.slash.fill） -->
            <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 9.5h3.2L11 5.5v13l-4.3-4H3.5z" fill="currentColor" stroke-width="1.2"/>
              <path d="M15 9l6 6"/><path d="M21 9l-6 6"/>
            </svg>
            </button>
            <input class="vol-range" id="vol-range" type="range" min="0" max="100" step="1" value="0" aria-label="音量">
            <span class="vol-num" id="vol-num"></span>
          </div>
          <div class="vol-note" id="vol-note" hidden>固定音量输出，请在解码器或功放上调音量</div>
        </div>
      </div>
    </div>
  </footer>
</div>

<!-- 存为播放列表：自定义弹窗（代替浏览器自带的 prompt / confirm） -->
<div class="modal" id="save-dlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="save-title">
    <h2 id="save-title">存为播放列表</h2>
    <div class="save-row">
      <div class="save-art" id="save-art"></div>
      <div class="save-field">
        <div class="save-input">
          <input id="save-name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="播放列表名称">
          <button class="save-clear" id="save-clear" type="button" aria-label="清空名称"><svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        </div>
        <div class="save-meta" id="save-meta"></div>
      </div>
    </div>
    <p class="save-note" id="save-note" hidden></p>
    <div class="dlg-btns">
      <button class="ghost" id="save-cancel" type="button">取消</button>
      <button class="primary" id="save-ok" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 设置菜单（点侧栏左下的齿轮）：放在边栏外面，免得被边栏的滚动区域裁掉、被播放条盖住 -->
<div class="set-pop" id="set-pop" role="menu" hidden>
  <button class="set-item" id="set-scan" role="menuitem">
    <span class="set-ico">
      <svg class="ico-scan" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5v5h-5"/></svg>
      <!-- 进度圆：点「重新扫描」后出现，扫描完消失；百分比未知时转圈 -->
      <svg class="scan-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring-bg" cx="12" cy="12" r="9"/><circle class="ring-fg" id="scan-fg" cx="12" cy="12" r="9" pathLength="100"/></svg>
    </span>
    <span class="set-txt"><span class="set-title" id="scan-title">重新扫描曲库</span><span class="set-sub" id="scan-sub" hidden></span></span>
  </button>
  <label class="set-item" id="set-sync-row">
    <span class="set-ico"><input type="checkbox" class="set-chk" id="set-sync"></span>
    <span class="set-txt"><span class="set-title">支持合并输出</span><span class="set-sub">可勾选多个设备同时播放</span></span>
  </label>
  <div class="set-sep" role="separator"></div>
  <button class="set-item danger" id="set-off" role="menuitem">
    <span class="set-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8"/><path d="M7.2 6.4a7.5 7.5 0 1 0 9.6 0"/></svg></span>
    <span class="set-txt"><span class="set-title">关机</span></span>
  </button>
  <!-- 版本号：菜单最下面一行浅灰小字（tools/build.py 按 id="app-ver" 改版本号） -->
  <div class="set-sep" role="separator"></div>
  <div class="set-ver">DaphileTouch <span class="app-ver" id="app-ver" aria-label="版本">v0.6.5</span></div>
</div>

<!-- 关机后盖住整页：提示按主机电源键开机，开机后自动刷新 -->
<div class="halt" id="halt" hidden>
  <div class="halt-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8"/><path d="M7.2 6.4a7.5 7.5 0 1 0 9.6 0"/></svg><h2>Daphile 正在关机</h2><p>完全关闭后，按主机电源键即可再开机；开机后此页会自动恢复。</p></div>
</div>

<!-- 确认弹窗（清除当前播放、重启安装更新）：代替浏览器自带的 confirm -->
<div class="modal" id="ask-dlg" hidden>
  <div class="dlg ask" role="alertdialog" aria-modal="true" aria-labelledby="ask-title" aria-describedby="ask-msg">
    <div class="ask-icon" id="ask-icon" hidden></div>
    <h2 id="ask-title"></h2>
    <p class="ask-msg" id="ask-msg" hidden></p>
    <div class="dlg-btns">
      <button class="ghost" id="ask-cancel" type="button">取消</button>
      <button class="primary" id="ask-ok" type="button">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="api.js?v=0.6.5"></script>
<script src="views.js?v=0.6.5"></script>
<script src="rhythm.js?v=0.6.5"></script>
<script src="app.js?v=0.6.5"></script>
</body>
</html>
